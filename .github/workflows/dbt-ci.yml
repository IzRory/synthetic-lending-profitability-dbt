name: dbt CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DBT_PROFILES_DIR: profiles
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Generate deterministic synthetic inputs
        run: python scripts/generate_synthetic_data.py

      - name: Validate sanitization controls
        run: python scripts/validate_no_sensitive_terms.py

      - name: Lint dbt SQL
        run: sqlfluff lint models analyses snapshots tests

      - name: Resolve dbt packages
        run: dbt deps

      - name: Validate DuckDB profile
        run: dbt debug --target ci

      - name: Load synthetic seeds
        run: dbt seed --target ci --full-refresh

      - name: Build and test project
        run: dbt build --target ci --fail-fast

      - name: Generate dbt documentation
        run: dbt docs generate --target ci

      - name: Validate dbt artifacts
        run: python scripts/check_dbt_artifacts.py

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            target/manifest.json
            target/run_results.json
            target/catalog.json
            logs/dbt.log
          if-no-files-found: warn
          retention-days: 5

